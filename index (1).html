<!doctype html>
<html lang="en"><head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>People Galaxy</title>
<link href="https://fonts.googleapis.com/css2?family=Figtree:wght@400;600&family=Unbounded:wght@500&display=swap" rel="stylesheet">
<style>
:root{--ink:#e9ecff;--dim:#8f96c4;--glass:rgba(14,18,42,.62);--line:rgba(255,255,255,.11);--amber:#ffb454}
*{box-sizing:border-box}
html,body{margin:0;height:100%;overflow:hidden;color:var(--ink);font:15px Figtree,system-ui,sans-serif;background:radial-gradient(ellipse at 50% 40%,#131a3f 0%,#070a1c 55%,#04050d 100%)}
canvas{position:fixed;inset:0;touch-action:none;cursor:grab}
#brand{position:fixed;top:20px;left:22px;font:500 15px Unbounded,system-ui,sans-serif;letter-spacing:.02em;pointer-events:none}
#legend{position:fixed;top:20px;right:22px;display:flex;flex-direction:column;gap:6px;font-size:12.5px;color:var(--dim);pointer-events:none}
#legend i,.list i{display:inline-block;width:8px;height:8px;border-radius:50%;margin-right:8px;box-shadow:0 0 8px currentColor}
.glass{background:var(--glass);backdrop-filter:blur(18px);-webkit-backdrop-filter:blur(18px);border:1px solid var(--line)}
#dock{position:fixed;left:50%;bottom:20px;transform:translateX(-50%);display:flex;gap:4px;padding:6px;border-radius:24px}
#dock button{display:flex;flex-direction:column;align-items:center;gap:4px;min-width:68px;padding:10px 12px 8px;border:0;border-radius:18px;background:none;color:var(--dim);font:600 12px Figtree,sans-serif;cursor:pointer;transition:background .2s,color .2s}
#dock button:hover{background:rgba(255,255,255,.07);color:var(--ink)}
#dock button.on{background:rgba(255,255,255,.14);color:var(--ink)}
#dock svg{width:22px;height:22px;fill:none;stroke:currentColor;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round}
#panel{position:fixed;left:50%;bottom:104px;transform:translateX(-50%);width:min(92vw,360px);max-height:62vh;overflow:auto;padding:18px;border-radius:22px;display:flex;flex-direction:column;gap:10px;animation:rise .22s ease-out}
#panel[hidden]{display:none}
@keyframes rise{from{opacity:0;transform:translate(-50%,12px)}}
h2{margin:0 0 2px;font-size:17px;font-weight:600}
label,.meta{font-size:12.5px;color:var(--dim)}
input,select,textarea{width:100%;padding:10px 12px;border-radius:12px;border:1px solid var(--line);background:rgba(255,255,255,.06);color:var(--ink);font:inherit;outline:none}
input:focus,select:focus,textarea:focus{border-color:var(--amber)}
textarea{resize:none;height:64px}
option{background:#10152e}
input.title{font-size:17px;font-weight:600;background:none;border-color:transparent;padding:0}
.chips{display:flex;flex-wrap:wrap;gap:6px}
.chip{padding:5px 11px;border-radius:99px;border:1px solid var(--c);background:none;color:var(--c);font:600 12.5px Figtree,sans-serif;cursor:pointer}
.chip.on{background:var(--c);color:#0a0a14}
.go{padding:11px;border:0;border-radius:12px;background:var(--amber);color:#1a1204;font:600 14px Figtree,sans-serif;cursor:pointer}
.ghost{padding:9px;border-radius:12px;border:1px solid var(--line);background:none;color:#ff8da6;font:600 13px Figtree,sans-serif;cursor:pointer}
.list{list-style:none;margin:0;padding:0;display:flex;flex-direction:column}
.list li{display:flex;align-items:center;padding:9px 6px;border-radius:10px;cursor:pointer}
.list li:hover{background:rgba(255,255,255,.07)}
.list li span{margin-left:auto;color:var(--dim);font-size:12.5px}
.result{padding:12px;border-radius:12px;background:rgba(255,180,84,.1);line-height:1.5}
#tip,#toast{position:fixed;pointer-events:none;padding:6px 11px;border-radius:10px;font-size:13px;opacity:0;transition:opacity .15s}
#tip{background:var(--glass);border:1px solid var(--line)}
#toast{left:50%;top:22px;transform:translateX(-50%);background:var(--glass);border:1px solid var(--line)}
#tip.show,#toast.show{opacity:1}
:focus-visible{outline:2px solid var(--amber);outline-offset:2px}
</style></head><body>
<canvas id="c"></canvas>
<div id="brand">People Galaxy</div>
<div id="legend"></div>
<div id="tip"></div><div id="toast"></div>
<section id="panel" class="glass" hidden></section>
<nav id="dock" class="glass">
 <button data-m="add"><svg viewBox="0 0 24 24"><path d="M12 5v14M5 12h14"/></svg>Add</button>
 <button data-m="link"><svg viewBox="0 0 24 24"><path d="M9 15l6-6M8 11l-2 2a3.5 3.5 0 005 5l2-2M16 13l2-2a3.5 3.5 0 00-5-5l-2 2"/></svg>Connect</button>
 <button data-m="path"><svg viewBox="0 0 24 24"><circle cx="6" cy="18" r="2.5"/><circle cx="18" cy="6" r="2.5"/><path d="M8 17c6-1 2-9 8-10"/></svg>Trace</button>
 <button data-m="search"><svg viewBox="0 0 24 24"><circle cx="11" cy="11" r="6"/><path d="M20 20l-4-4"/></svg>Find</button>
</nav>
<script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
<script>
const TYPES={friend:'#ffb454',family:'#ff6b8b',classmate:'#7cc4ff',teammate:'#7dffc0',colleague:'#c3a6ff',custom:'#e6e9f5'};
const $=s=>document.querySelector(s),uid=()=>Math.random().toString(36).slice(2,9),clamp=(v,a,b)=>Math.max(a,Math.min(b,v));
const esc=s=>String(s).replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
let G={people:[],links:[]},N={},L={},mode=null,curType='friend',sel=null,hi=null,moved=0,busy=false;
const calm=matchMedia('(prefers-reduced-motion:reduce)').matches;
$('#legend').innerHTML=Object.keys(TYPES).map(t=>`<div><i style="color:${TYPES[t]};background:${TYPES[t]}"></i>${t}</div>`).join('');

/* ---------- 3D scene ---------- */
const R=new THREE.WebGLRenderer({canvas:$('#c'),antialias:true,alpha:true});R.setPixelRatio(Math.min(devicePixelRatio,2));
const S=new THREE.Scene(),cam=new THREE.PerspectiveCamera(60,1,.1,3000);
let rotY=.5,rotX=.25,dist=55;const target=new THREE.Vector3(),goal=new THREE.Vector3();
const placeCam=()=>{cam.position.set(target.x+dist*Math.sin(rotY)*Math.cos(rotX),target.y+dist*Math.sin(rotX),target.z+dist*Math.cos(rotY)*Math.cos(rotX));cam.lookAt(target)};
const resize=()=>{R.setSize(innerWidth,innerHeight);cam.aspect=innerWidth/innerHeight;cam.updateProjectionMatrix()};
addEventListener('resize',resize);resize();
const gc=document.createElement('canvas');gc.width=gc.height=64;
{const x=gc.getContext('2d'),g=x.createRadialGradient(32,32,0,32,32,32);g.addColorStop(0,'rgba(255,255,255,1)');g.addColorStop(.25,'rgba(255,255,255,.35)');g.addColorStop(1,'rgba(255,255,255,0)');x.fillStyle=g;x.fillRect(0,0,64,64)}
const GLOW=new THREE.CanvasTexture(gc);
function cloud(n,r0,r1,size,color,op,att){const a=new Float32Array(n*3);for(let i=0;i<n;i++){const r=r0+Math.random()*(r1-r0),u=Math.random()*2-1,t=Math.random()*6.283,s=Math.sqrt(1-u*u);a[i*3]=r*s*Math.cos(t);a[i*3+1]=r*u;a[i*3+2]=r*s*Math.sin(t)}
 const g=new THREE.BufferGeometry();g.setAttribute('position',new THREE.BufferAttribute(a,3));const p=new THREE.Points(g,new THREE.PointsMaterial({size,color,transparent:true,opacity:op,sizeAttenuation:att,depthWrite:false}));S.add(p);return p}
const stars=cloud(3000,90,800,1.6,0xaab4ff,.7,false),dust=cloud(700,6,60,.5,0xffb454,.35,true);

const hue=s=>{let h=0;for(const c of s)h=(h*31+c.charCodeAt(0))%360;return h};
function labelTex(t){const c=document.createElement('canvas');c.width=256;c.height=64;const x=c.getContext('2d');x.font='600 26px Figtree,system-ui,sans-serif';x.textAlign='center';x.fillStyle='#e9ecff';x.shadowColor='#000';x.shadowBlur=6;x.fillText(t.slice(0,18),128,40);return new THREE.CanvasTexture(c)}
function addNode(p){
 const col=new THREE.Color().setHSL(hue(p.id)/360,.75,.68),g=new THREE.Group();
 const core=new THREE.Mesh(new THREE.SphereGeometry(1.1,24,16),new THREE.MeshBasicMaterial({color:col}));
 const glow=new THREE.Sprite(new THREE.SpriteMaterial({map:GLOW,color:col,blending:THREE.AdditiveBlending,transparent:true,depthWrite:false}));glow.scale.set(6,6,1);
 const lab=new THREE.Sprite(new THREE.SpriteMaterial({map:labelTex(p.name),transparent:true,depthWrite:false}));lab.scale.set(8,2,1);lab.position.y=-2.3;
 const pick=new THREE.Mesh(new THREE.SphereGeometry(2.2,8,6),new THREE.MeshBasicMaterial({colorWrite:false,depthWrite:false}));pick.userData.id=p.id;
 g.add(core,glow,lab,pick);g.position.set(p.x,p.y,p.z);S.add(g);N[p.id]={g,glow,lab,pick,ph:Math.random()*6};
}
function addLink(l){
 const c=TYPES[l.type]||TYPES.custom,geo=new THREE.BufferGeometry();geo.setAttribute('position',new THREE.BufferAttribute(new Float32Array(6),3));
 const line=new THREE.Line(geo,new THREE.LineBasicMaterial({color:c,transparent:true,opacity:.6}));line.userData.id=l.id;
 const pulse=new THREE.Sprite(new THREE.SpriteMaterial({map:GLOW,color:c,blending:THREE.AdditiveBlending,transparent:true,depthWrite:false}));pulse.scale.set(2.2,2.2,1);
 S.add(line,pulse);L[l.id]={line,pulse,off:Math.random(),l,c};syncLink(l.id);
}
function syncLink(id){const o=L[id],a=N[o.l.a].g.position,b=N[o.l.b].g.position,p=o.line.geometry.attributes.position;p.setXYZ(0,a.x,a.y,a.z);p.setXYZ(1,b.x,b.y,b.z);p.needsUpdate=true;o.line.geometry.computeBoundingSphere()}
function applyHi(){
 for(const id in N){const on=!hi||hi.n.has(id);N[id].glow.material.opacity=on?1:.15;N[id].lab.material.opacity=on?1:.25}
 for(const id in L){const o=L[id],on=!hi||hi.l.has(id);o.line.material.color.set(hi&&on?'#ffffff':o.c);o.line.material.opacity=on?(hi?1:.6):.07;o.pulse.material.opacity=on?1:0}
}
function focusOn(id){hi={n:new Set([id]),l:new Set()};G.links.forEach(l=>{if(l.a===id||l.b===id){hi.n.add(l.a);hi.n.add(l.b);hi.l.add(l.id)}});applyHi()}

/* ---------- data ---------- */
let saveT;const persist=()=>{clearTimeout(saveT);saveT=setTimeout(()=>{localStorage.setItem('pg',JSON.stringify(G));fetch('/api/graph',{method:'PUT',headers:{'Content-Type':'application/json'},body:JSON.stringify(G)}).catch(()=>{})},500)};
function toast(t){const e=$('#toast');e.textContent=t;e.classList.add('show');clearTimeout(toast.t);toast.t=setTimeout(()=>e.classList.remove('show'),2200)}
const nm=id=>(G.people.find(p=>p.id===id)||{}).name;
function connect(a,b,type,label){
 if(!a||!b||a===b)return toast('Pick two different people');
 if(G.links.some(l=>(l.a===a&&l.b===b)||(l.a===b&&l.b===a)))return toast('Already connected');
 const l={id:uid(),a,b,type,label:label||type};G.links.push(l);addLink(l);persist();return true}
function addPerson(name,note,to,type,label){
 const base=G.people.find(p=>p.id===to),r=()=>Math.random()-.5,v=new THREE.Vector3(r(),r(),r()).normalize().multiplyScalar(base?9:8+Math.random()*14);
 const p={id:uid(),name,note,x:(base?base.x:0)+v.x,y:(base?base.y:0)+v.y,z:(base?base.z:0)+v.z};
 G.people.push(p);addNode(p);if(to)connect(p.id,to,type,label);persist();return p}
function delLink(id){const o=L[id];S.remove(o.line,o.pulse);delete L[id];G.links=G.links.filter(l=>l.id!==id);persist()}
function delPerson(id){G.links.filter(l=>l.a===id||l.b===id).forEach(l=>delLink(l.id));S.remove(N[id].g);delete N[id];G.people=G.people.filter(p=>p.id!==id);persist()}
function trace(a,b){
 const adj={};G.links.forEach(l=>{(adj[l.a]=adj[l.a]||[]).push([l.b,l]);(adj[l.b]=adj[l.b]||[]).push([l.a,l])});
 const prev={[a]:null},q=[a];
 while(q.length){const c=q.shift();if(c===b)break;for(const[n,l]of adj[c]||[])if(!(n in prev)){prev[n]=[c,l];q.push(n)}}
 if(!(b in prev))return null;const ns=[b],ls=[];let c=b;while(prev[c]){const[p,l]=prev[c];ls.unshift(l);ns.unshift(p);c=p}return{ns,ls}}

/* ---------- menu & panels ---------- */
const opts=()=>G.people.map(p=>`<option value="${p.id}">${esc(p.name)}</option>`).join('');
const chips=()=>`<div class="chips">${Object.keys(TYPES).map(t=>`<button type="button" class="chip${t===curType?' on':''}" data-t="${t}" style="--c:${TYPES[t]}">${t}</button>`).join('')}</div>`;
function setMode(m,id){
 mode=m;sel=id||null;hi=null;
 document.querySelectorAll('#dock button').forEach(b=>b.classList.toggle('on',b.dataset.m===m));
 if(m==='person')focusOn(sel);applyHi();render()}
function render(){
 const P=$('#panel');if(!mode){P.hidden=true;return}P.hidden=false;let h='';
 if(mode==='add')h=`<h2>Add a person</h2><input id="nm" placeholder="Name" autocomplete="off"><input id="nt" placeholder="Private note (optional)" autocomplete="off">
  <label>Connect to</label><select id="to"><option value="">No one yet</option>${opts()}</select>${chips()}<input id="lb" placeholder="Relationship name, e.g. brother" autocomplete="off"><button class="go" data-act="add">Add to galaxy</button>`;
 if(mode==='link')h=`<h2>Connect two people</h2><label>From</label><select id="a">${opts()}</select><label>To</label><select id="b">${opts()}</select>${chips()}<input id="lb" placeholder="Relationship name, e.g. cousin" autocomplete="off"><button class="go" data-act="link">Connect</button>`;
 if(mode==='path')h=`<h2>How are they connected?</h2><select id="a">${opts()}</select><select id="b">${opts()}</select><button class="go" data-act="trace">Trace connection</button><div id="res"></div>`;
 if(mode==='search')h=`<h2>Find a person</h2><input id="q" placeholder="Start typing a name" autocomplete="off"><ul class="list" id="rl"></ul>`;
 if(mode==='person'){const p=G.people.find(x=>x.id===sel),cs=G.links.filter(l=>l.a===sel||l.b===sel);
  h=`<input class="title" id="pn" value="${esc(p.name)}"><textarea id="pt" placeholder="Private note">${esc(p.note||'')}</textarea><div class="meta">${cs.length} connection${cs.length===1?'':'s'}</div>
  <ul class="list">${cs.map(l=>{const o=l.a===sel?l.b:l.a;return`<li data-act="goto" data-id="${o}"><i style="color:${TYPES[l.type]};background:${TYPES[l.type]}"></i>${esc(nm(o))}<span>${esc(l.label)}</span></li>`}).join('')}</ul>
  <button class="ghost" data-act="delp">Remove ${esc(p.name)}</button>`}
 if(mode==='edge'){const l=G.links.find(x=>x.id===sel);h=`<h2>${esc(nm(l.a))} and ${esc(nm(l.b))}</h2><label>Relationship (edit it any time)</label><input id="el" value="${esc(l.label)}"><button class="ghost" data-act="dell">Remove connection</button>`}
 P.innerHTML=h;
 if(mode==='search')results('');
 if(mode==='add'||mode==='search'){const f=P.querySelector('input');if(f&&innerWidth>700)f.focus()}
}
function results(q){$('#rl').innerHTML=G.people.filter(p=>p.name.toLowerCase().includes(q.toLowerCase())).map(p=>`<li data-act="goto" data-id="${p.id}">${esc(p.name)}</li>`).join('')||'<li>No one found</li>'}
function go(id){goal.copy(N[id].g.position);setMode('person',id)}
$('#dock').onclick=e=>{const b=e.target.closest('button');if(!b)return;const m=b.dataset.m;if(mode===m)setMode(null);else{if(G.people.length<2&&(m==='link'||m==='path')){toast('Add at least two people first');return}setMode(m)}};
$('#panel').addEventListener('click',e=>{
 const t=e.target.closest('[data-t]');if(t){curType=t.dataset.t;document.querySelectorAll('.chip').forEach(c=>c.classList.toggle('on',c.dataset.t===curType));const lb=$('#lb');if(lb){lb.placeholder=curType==='custom'?'Type your own, e.g. neighbor':'Relationship name, e.g. brother';if(curType==='custom')lb.focus()}return}
 const el=e.target.closest('[data-act]');if(!el)return;const v=id=>$(id)&&$(id).value;
 switch(el.dataset.act){
  case'add':{const n=v('#nm').trim();if(!n)return toast('Enter a name');if(v('#to')&&curType==='custom'&&!v('#lb').trim())return toast('Type your custom relationship');const p=addPerson(n,v('#nt').trim(),v('#to'),curType,v('#lb').trim());toast(n+' added');go(p.id);break}
  case'link':if(curType==='custom'&&!v('#lb').trim())return toast('Type your custom relationship');if(connect(v('#a'),v('#b'),curType,v('#lb').trim())){toast('Connected');setMode(null)}break;
  case'trace':{const a=v('#a'),b=v('#b'),r=trace(a,b);if(a===b){$('#res').innerHTML='';return toast('Pick two different people')}
   if(!r){hi=null;applyHi();$('#res').className='result';$('#res').textContent=nm(a)+' and '+nm(b)+' are not connected yet.';break}
   hi={n:new Set(r.ns),l:new Set(r.ls.map(l=>l.id))};applyHi();$('#res').className='result';
   $('#res').textContent=r.ns.map((id,i)=>i?` → ${nm(id)} (${r.ls[i-1].label})`:nm(id)).join('');break}
  case'goto':go(el.dataset.id);break;
  case'delp':if(G.people.length>1||confirm('Remove the last person?')){delPerson(sel);setMode(null)}break;
  case'dell':delLink(sel);setMode(null);break}
});
$('#panel').addEventListener('input',e=>{if(e.target.id==='q')results(e.target.value)});
$('#panel').addEventListener('change',e=>{if(e.target.id==='el'){const l=G.links.find(x=>x.id===sel);if(l&&e.target.value.trim()){l.label=e.target.value.trim();persist()}return}
 const p=G.people.find(x=>x.id===sel);if(!p)return;
 if(e.target.id==='pn'&&e.target.value.trim()){p.name=e.target.value.trim();N[p.id].lab.material.map=labelTex(p.name);persist()}
 if(e.target.id==='pt'){p.note=e.target.value;persist()}});
addEventListener('keydown',e=>{if(e.key==='Escape')setMode(null)});

/* ---------- interaction ---------- */
const cv=$('#c'),ray=new THREE.Raycaster(),m2=new THREE.Vector2(),plane=new THREE.Plane(),pt=new THREE.Vector3(),dir=new THREE.Vector3(),ptrs=new Map();
ray.params.Line.threshold=.8;let drag=null,down=null,pinch=0;
const setRay=e=>{m2.set(e.clientX/innerWidth*2-1,-(e.clientY/innerHeight)*2+1);ray.setFromCamera(m2,cam)};
function pick(e){setRay(e);const n=ray.intersectObjects(Object.values(N).map(o=>o.pick))[0];if(n)return{t:'n',id:n.object.userData.id};
 const l=ray.intersectObjects(Object.values(L).map(o=>o.line))[0];return l?{t:'l',id:l.object.userData.id}:null}
const pd=()=>{const[a,b]=[...ptrs.values()];return Math.hypot(a.x-b.x,a.y-b.y)||1};
cv.addEventListener('pointerdown',e=>{cv.setPointerCapture(e.pointerId);ptrs.set(e.pointerId,{x:e.clientX,y:e.clientY});moved=0;busy=true;
 if(ptrs.size===2){drag=null;down=null;pinch=pd();return}
 down=pick(e);drag=null;
 if(down&&down.t==='n'){const g=N[down.id].g;plane.setFromNormalAndCoplanarPoint(cam.getWorldDirection(dir),g.position);if(ray.ray.intersectPlane(plane,pt))drag={id:down.id,off:g.position.clone().sub(pt)}}});
cv.addEventListener('pointermove',e=>{const pr=ptrs.get(e.pointerId),tip=$('#tip');
 if(!pr){const h=pick(e);cv.style.cursor=h?'pointer':'grab';if(h){tip.textContent=h.t==='n'?nm(h.id):G.links.find(l=>l.id===h.id).label;tip.style.left=e.clientX+14+'px';tip.style.top=e.clientY+14+'px';tip.classList.add('show')}else tip.classList.remove('show');return}
 tip.classList.remove('show');const dx=e.clientX-pr.x,dy=e.clientY-pr.y;pr.x=e.clientX;pr.y=e.clientY;moved+=Math.abs(dx)+Math.abs(dy);
 if(ptrs.size===2){const d=pd();dist=clamp(dist*pinch/d,15,220);pinch=d;return}
 if(drag){setRay(e);if(ray.ray.intersectPlane(plane,pt)){N[drag.id].g.position.copy(pt.add(drag.off));G.links.forEach(l=>{if(l.a===drag.id||l.b===drag.id)syncLink(l.id)})}}
 else{rotY-=dx*.005;rotX=clamp(rotX+dy*.005,-1.4,1.4)}});
const up=e=>{if(!ptrs.delete(e.pointerId))return;if(ptrs.size)return;busy=false;
 if(drag&&moved>4){const p=G.people.find(x=>x.id===drag.id),q=N[drag.id].g.position;p.x=q.x;p.y=q.y;p.z=q.z;persist()}
 else if(moved<5){if(down&&down.t==='n')go(down.id);else if(down&&down.t==='l')setMode('edge',down.id);else if(mode==='person'||mode==='edge')setMode(null)}
 drag=null;down=null};
cv.addEventListener('pointerup',up);cv.addEventListener('pointercancel',up);
cv.addEventListener('wheel',e=>{e.preventDefault();dist=clamp(dist*Math.exp(e.deltaY*.001),15,220)},{passive:false});

/* ---------- loop ---------- */
const va=new THREE.Vector3(),t0=performance.now();
function loop(){requestAnimationFrame(loop);const t=(performance.now()-t0)/1000;
 if(!busy&&!calm&&!mode)rotY+=.0005;
 target.lerp(goal,.06);placeCam();stars.rotation.y=t*.004;dust.rotation.y=-t*.01;
 for(const id in N){const o=N[id],s=5.4+(calm?0:Math.sin(t*2+o.ph)*.6);o.glow.scale.set(s,s,1)}
 if(!calm)for(const id in L){const o=L[id];o.pulse.position.lerpVectors(N[o.l.a].g.position,N[o.l.b].g.position,(t*.22+o.off)%1)}
 else for(const id in L)L[id].pulse.visible=false;
 R.render(S,cam)}

/* ---------- boot ---------- */
(async()=>{
 try{const r=await fetch('/api/graph');if(!r.ok)throw 0;G=await r.json()}catch{G=JSON.parse(localStorage.getItem('pg')||'null')||G}
 try{const bk=JSON.parse(localStorage.getItem('pg')||'null');if(bk&&bk.people&&bk.people.length>G.people.length&&G.people.length<2){G=bk;persist();setTimeout(()=>toast('Restored your saved galaxy'),600)}}catch{}
 if(!G.people.length){G={people:[{id:uid(),name:'You',note:'',x:0,y:0,z:0}],links:[]};persist();setTimeout(()=>toast('Add your first person to start the galaxy'),600)}
 G.people.forEach(addNode);G.links.forEach(addLink);loop()})();
</script></body></html>
